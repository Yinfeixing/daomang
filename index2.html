<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>看见 · 视障公益影像展</title>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <style>
        /* ================= 全局重置 ================= */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body {
            width: 100%;
            font-family: 'ZCOOL KuaiLe', sans-serif;
            overflow-x: hidden;
            background-color: #ffffff; /* 纯白底色 */
            -webkit-tap-highlight-color: transparent;
            /* 恢复自然的滚动，去掉强制吸附 */
            scroll-behavior: smooth;
        }
        ::-webkit-scrollbar { width: 0; }

        /* ================= 顶部进度条 ================= */
        .progress-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 4px;
            background: rgba(0, 0, 0, 0.05);
            z-index: 9999;
        }
        .progress-bar {
            height: 100%;
            background: #1a1a1a;
            width: 0%;
            transform-origin: left;
            /* 纯 CSS 滚动驱动动画，绑定页面整体滚动进度 */
            animation: growProgress auto linear;
            animation-timeline: scroll(root);
        }
        @keyframes growProgress {
            from { transform: scaleX(0); }
            to { transform: scaleX(1); }
        }

        /* ================= 瀑布流布局 ================= */
        .gallery-wrapper {
            padding: 6vh 4vw;
            max-width: 1600px;
            margin: 0 auto;
            /* 初始隐藏，等 JS 排版完成后再显示，避免跳动 */
            opacity: 0;
            transition: opacity 0.6s ease;
        }

        .masonry-grid {
            display: flex;
            justify-content: center;
            gap: 24px; 
            align-items: flex-start;
        }

        .masonry-col {
            display: flex;
            flex-direction: column;
            gap: 24px; 
            width: 33.33%;
            flex-shrink: 0;
        }

        /* 错落感：给列加上初始的高低差 */
        .masonry-col:nth-child(1) { margin-top: 0; }
        .masonry-col:nth-child(2) { margin-top: 10vh; }
        .masonry-col:nth-child(3) { margin-top: 4vh; }

        /* 图片卡片 */
        .photo-card {
            position: relative;
            width: 100%;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
            background-color: #f5f5f5; 
            
            /* 滚动淡入初始状态 */
            opacity: 0;
            transform: translateY(24px);
            transition: opacity 0.6s ease-out, transform 0.6s ease-out;
            will-change: opacity, transform;
        }

        /* 进入视口触发 */
        .photo-card.reveal {
            opacity: 1;
            transform: translateY(0);
        }

        /* 绝不裁剪 */
        .photo-card img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
        }

        /* ================= 结尾文案 ================= */
        .outro-section {
            min-height: 100vh;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
            padding: 0 20px;
            background-color: #e8e6e1;
        }
        .outro-title {
            font-size: clamp(1.8rem, 5vw, 3rem); 
            line-height: 1.8; letter-spacing: 0.1em;
            color: #1a1a1a; margin-bottom: 30px;
        }
        .outro-desc {
            font-size: clamp(0.95rem, 2vw, 1.1rem); 
            color: #555; line-height: 2; letter-spacing: 0.05em;
        }

        /* ================= 移动端适配 ================= */
        @media (max-width: 768px) {
            .gallery-wrapper { padding: 4vh 3vw; }
            .masonry-grid { gap: 12px; }
            .masonry-col { gap: 12px; }
            .masonry-col:nth-child(2) { margin-top: 5vh; }
            .masonry-col:nth-child(3) { margin-top: 2vh; }
        }
    </style>
</head>
<body>

    <!-- 顶部进度条 -->
    <div class="progress-container">
        <div class="progress-bar"></div>
    </div>

    <!-- 完整的单一瀑布流容器 -->
    <div class="gallery-wrapper" id="galleryWrapper">
        <div class="masonry-grid" id="masonryGrid">
            <div class="masonry-col" id="col-1"></div>
            <div class="masonry-col" id="col-2"></div>
            <div class="masonry-col" id="col-3"></div>
        </div>
    </div>

    <!-- 结尾文案 -->
    <section class="outro-section">
        <h2 class="outro-title">不同的感知<br>一样的梦想</h2>
        <p class="outro-desc">
            或许他们的世界没有色彩，没有光影。<br>
            但每一次奔跑、每一份陪伴、每一个微小的改变，<br>
            都在让这个世界变得更加包容。
        </p>
    </section>

    <!-- 引入平滑滚动库 Lenis -->
    <script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.29/dist/lenis.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // ==========================================
            // 1. 图片数据 (整体 30 张图，不加分组)
            // ==========================================
            // 末尾依然保留了 img-1 和 img-2 作为垫底图防止留白
            const imageData = [
                'img-1.jpg', 'img-2.jpg', 'img-3.jpg', 'img-4.jpg', 'img-5.jpg',
                'img-6.jpg', 'img-7.jpg', 'img-8.jpg', 'img-9.jpg', 'img-10.jpg',
                'img-11.jpg', 'img-12.jpg', 'img-13.jpg', 'img-14.jpg', 'img-15.jpg',
                'img-16.jpg', 'img-17.jpg', 'img-18.jpg', 'img-19.jpg', 'img-20.jpg',
                'img-21.jpg', 'img-22.jpg', 'img-23.jpg', 'img-24.jpg', 'img-25.jpg',
                'img-26.jpg', 'img-27.jpg', 'img-28.jpg',
                'img-1.jpg', 'img-2.jpg'
            ];

            const col1 = document.getElementById('col-1');
            const col2 = document.getElementById('col-2');
            const col3 = document.getElementById('col-3');
            const cols = [col1, col2, col3];
            const wrapper = document.getElementById('galleryWrapper');

            const colWidth = col1.clientWidth; 
            let colHeights = [0, 0, 0]; 
            let loadedCount = 0;

            // ==========================================
            // 2. 智能瀑布流排布 (无标题，整体排布)
            // ==========================================
            imageData.forEach((src) => {
                const img = new Image();
                img.src = src;
                
                img.onload = () => {
                    const card = document.createElement('div');
                    card.className = 'photo-card';
                    card.setAttribute('data-observe', ''); // 标记用于滚动观察
                    card.appendChild(img);

                    // 计算图片在当前列宽下的实际显示高度
                    const realHeight = (colWidth / img.naturalWidth) * img.naturalHeight;

                    // 找到目前最短的那一列
                    let minIdx = 0;
                    if (colHeights[1] < colHeights[minIdx]) minIdx = 1;
                    if (colHeights[2] < colHeights[minIdx]) minIdx = 2;

                    // 放入最短的列
                    cols[minIdx].appendChild(card);

                    // 更新高度（包含 gap 间距）
                    const gapSize = window.innerWidth <= 768 ? 12 : 24;
                    colHeights[minIdx] += realHeight + gapSize;

                    loadedCount++;
                    // 当所有图片都排布完毕后，显示页面并开始观察动画
                    if (loadedCount === imageData.length) {
                        wrapper.style.opacity = '1';
                        initObserver();
                        if (window.lenis) window.lenis.resize();
                    }
                };

                img.onerror = () => {
                    loadedCount++;
                    if (loadedCount === imageData.length) {
                        wrapper.style.opacity = '1';
                        initObserver();
                    }
                };
            });

            // ==========================================
            // 3. 只触发一次的淡入观察器
            // ==========================================
            function initObserver() {
                const observerOptions = {
                    root: null,
                    rootMargin: '0px 0px -10% 0px', // 元素进入屏幕底部 10% 处触发
                    threshold: 0
                };

                const observer = new IntersectionObserver((entries, obs) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('reveal');
                            // 核心：取消监听，保证只触发一次
                            obs.unobserve(entry.target);
                        }
                    });
                }, observerOptions);

                document.querySelectorAll('[data-observe]').forEach(el => {
                    observer.observe(el);
                });
            }


            // ==========================================
            // 4. Lenis 丝滑滚动
            // ==========================================
            if (typeof Lenis !== 'undefined') {
                window.lenis = new Lenis({
                    duration: 1.2,
                    easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
                    smooth: true,
                    direction: 'vertical',
                });

                function raf(time) {
                    window.lenis.raf(time);
                    requestAnimationFrame(raf);
                }
                requestAnimationFrame(raf);
            }
        });
    </script>
</body>
</html>
